# TripMate - PHP (Laravel) + MySQL
# Khởi động:  docker compose up -d --build
# Frontend Angular chạy riêng trên máy: cd frontend && npm start

name: tripmate-php

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tripmate
      MYSQL_USER: tripmate
      MYSQL_PASSWORD: tripmate
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3307:3306"   # máy: 3307 -> container: 3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Ghi đè DB_* trong backend/.env khi chạy trong Docker
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: tripmate
      DB_USERNAME: tripmate
      DB_PASSWORD: tripmate
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html

volumes:
  mysql_data:
