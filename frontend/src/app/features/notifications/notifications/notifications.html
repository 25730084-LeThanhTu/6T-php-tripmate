<!-- Đầu trang desktop (46:1371) -->
<header class="hidden items-center gap-6 lg:flex">
  <div class="flex flex-1 flex-col gap-1.5">
    <h1 class="text-[32px] font-bold text-ink">Thông báo</h1>
    <p class="text-sm whitespace-pre text-muted">{{ subtitle }}</p>
  </div>
  <button type="button" (click)="markAllRead()" [disabled]="unreadCount() === 0"
          class="text-sm font-semibold text-primary disabled:text-muted">Đánh dấu tất cả đã đọc</button>
</header>
<h1 class="sr-only lg:hidden">Thông báo</h1>

<!-- Bộ lọc (67:2720 / 67:3362) -->
<div class="flex items-center gap-2">
  <div class="flex flex-1 gap-2" role="group" aria-label="Lọc thông báo">
    <button type="button" (click)="filter.set('all')" [attr.aria-pressed]="filter() === 'all'"
            class="rounded-card px-[14px] py-2 text-[13px] font-semibold"
            [class.bg-primary]="filter() === 'all'" [class.text-white]="filter() === 'all'"
            [class.bg-primary-tint]="filter() !== 'all'" [class.text-primary]="filter() !== 'all'">Tất cả</button>
    <button type="button" (click)="filter.set('unread')" [attr.aria-pressed]="filter() === 'unread'"
            class="rounded-card px-[14px] py-2 text-[13px] font-semibold"
            [class.bg-primary]="filter() === 'unread'" [class.text-white]="filter() === 'unread'"
            [class.bg-primary-tint]="filter() !== 'unread'" [class.text-primary]="filter() !== 'unread'">
      Chưa đọc{{ unreadCount() ? ' (' + unreadCount() + ')' : '' }}
    </button>
  </div>
  <button type="button" (click)="markAllRead()" [disabled]="unreadCount() === 0"
          class="text-xs font-semibold text-primary disabled:text-muted lg:hidden">Đọc tất cả</button>
</div>

<!-- Danh sách thông báo (67:2723 / 67:3365) -->
<ul class="flex flex-col gap-3 lg:grid lg:grid-cols-2 lg:gap-4">
  @for (n of visible(); track n.id) {
    <li>
      <a [routerLink]="n.link" (click)="markRead(n.id)"
         class="flex h-full items-start gap-3 rounded-card p-[18px] lg:p-6"
         [class.bg-primary-soft]="!n.isRead" [class.bg-surface]="n.isRead">
        <div class="flex min-w-0 flex-1 flex-col gap-1.5">
          <div class="flex items-center gap-2">
            <span class="text-[11px] font-bold text-primary lg:text-xs">{{ typeLabel[n.type] }}</span>
            <span class="text-[11px] text-muted lg:text-xs">· {{ n.timeLabel }}</span>
          </div>
          <p class="text-sm text-ink lg:text-[15px]" [class.font-bold]="!n.isRead" [class.font-semibold]="n.isRead">{{ n.title }}</p>
          <p class="text-[13px] text-muted lg:text-sm">{{ n.body }}</p>
        </div>
        @if (!n.isRead) {
          <span class="mt-1.5 size-2 shrink-0 rounded-full bg-accent"><span class="sr-only">Chưa đọc</span></span>
        }
      </a>
    </li>
  } @empty {
    <li class="rounded-card bg-surface p-[18px] text-center text-[13px] text-muted lg:col-span-2 lg:p-6 lg:text-[15px]">
      Bạn đã đọc hết thông báo.
    </li>
  }
</ul>
