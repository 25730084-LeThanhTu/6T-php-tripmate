<!-- Figma: Nội dung 2:5 (mobile) · Thông tin tài khoản 46:1458 (desktop) -->
<form class="flex flex-col gap-[18px] lg:gap-5" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <!-- Mobile: ảnh, chip, tiêu đề (desktop đã có ở cột thương hiệu của AuthLayout) -->
  <img
    src="images/auth-hero.jpg"
    alt="Nhóm bạn cùng du lịch Đà Lạt"
    width="1200"
    height="896"
    class="h-[196px] w-full rounded-media object-cover lg:hidden"
  />
  <span
    class="self-start rounded-card bg-primary-soft px-2.5 py-1.5 text-[11px] font-bold whitespace-nowrap text-primary lg:hidden"
  >
    ĐI CÙNG NHAU. CHIA SẺ DỄ DÀNG.
  </span>
  <h1 class="text-[28px] font-bold text-ink lg:hidden">Chuyến đi vui hơn, khi có nhau</h1>
  <p class="text-[13px] text-muted lg:hidden">Đồng hành khám phá – Minh bạch sẻ chia</p>

  <!-- Desktop: lời chào -->
  <h1 class="hidden text-[34px] font-bold text-ink lg:block">Chào mừng trở lại!</h1>
  <p class="hidden text-[15px] text-muted lg:block">Đăng nhập để tiếp tục hành trình cùng hội bạn.</p>

  <!-- Email -->
  <div class="flex flex-col gap-[7px]">
    <label for="login-email" class="text-xs font-semibold text-muted lg:text-[13px]">Email</label>
    <div
      class="flex items-center gap-3 rounded-input border border-line bg-surface px-3.5 py-[13px] focus-within:border-primary focus-within:ring-1 focus-within:ring-primary"
    >
      <img src="icons/auth/mail.svg" alt="" width="19" height="19" class="shrink-0" />
      <input
        id="login-email"
        type="email"
        autocomplete="email"
        formControlName="email"
        class="min-w-0 flex-1 bg-transparent text-sm text-ink outline-none lg:text-[15px]"
      />
    </div>
  </div>

  <!-- Mật khẩu -->
  <div class="flex flex-col gap-[7px]">
    <label for="login-password" class="text-xs font-semibold text-muted lg:text-[13px]">Mật khẩu</label>
    <div
      class="flex items-center gap-3 rounded-input border border-line bg-surface px-3.5 py-[13px] focus-within:border-primary focus-within:ring-1 focus-within:ring-primary"
    >
      <img src="icons/auth/lock.svg" alt="" width="19" height="19" class="shrink-0" />
      <input
        id="login-password"
        type="password"
        autocomplete="current-password"
        formControlName="password"
        class="min-w-0 flex-1 bg-transparent text-sm text-ink outline-none lg:text-[15px]"
      />
    </div>
  </div>

  <!-- Ghi nhớ đăng nhập · Quên mật khẩu -->
  <div class="flex items-center gap-3 text-xs lg:text-[13px]">
    <label class="flex flex-1 cursor-pointer items-center">
      <input type="checkbox" formControlName="remember" class="peer sr-only" />
      <span class="text-muted peer-checked:text-ink peer-focus-visible:underline">Ghi nhớ đăng nhập</span>
    </label>
    <a [routerLink]="links.forgotPassword" class="flex-1 text-right font-bold text-primary hover:underline">
      Quên mật khẩu?
    </a>
  </div>

  <button
    type="submit"
    [disabled]="submitting()"
    class="flex w-full items-center justify-center gap-2 rounded-button bg-primary px-[18px] py-[15px] text-[15px] font-bold text-white hover:opacity-90 disabled:opacity-70"
  >
    <img src="icons/auth/chev.svg" alt="" width="20" height="20" />
    Đăng nhập
  </button>

  <p class="pt-8 text-center text-[11px] font-medium text-muted lg:pt-0 lg:text-[13px]">
    Chưa có tài khoản?&nbsp;
    <a [routerLink]="links.register" class="hover:text-primary hover:underline">Đăng ký</a>
  </p>
</form>
