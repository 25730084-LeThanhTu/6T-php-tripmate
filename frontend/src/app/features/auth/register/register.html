<!-- Figma: Nội dung 2:10 (mobile) · Thông tin tài khoản 46:1490 (desktop) -->
<form class="flex flex-col gap-[18px] lg:gap-5" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <h1 class="text-[28px] font-bold text-ink lg:text-[32px]">Bắt đầu hành trình mới</h1>
  <p class="text-[13px] text-muted lg:text-[15px]">Một tài khoản cho những chuyến đi cùng nhau.</p>

  @for (field of fields; track field.id) {
    <div class="flex flex-col gap-[7px]">
      <label [for]="field.id" class="text-xs font-semibold text-muted lg:text-[13px]">{{ field.label }}</label>
      <div
        class="flex items-center gap-3 rounded-input border bg-surface px-3.5 py-[13px] focus-within:border-primary focus-within:ring-1 focus-within:ring-primary"
        [class.border-line]="!invalid(field)"
        [class.border-accent]="invalid(field)"
      >
        @if (field.icon) {
          <img [src]="field.icon" alt="" width="19" height="19" class="shrink-0" />
        }
        <input
          [id]="field.id"
          [type]="field.type"
          [placeholder]="field.placeholder"
          [autocomplete]="field.autocomplete"
          [formControlName]="field.control"
          [attr.aria-invalid]="invalid(field)"
          class="min-w-0 flex-1 bg-transparent text-sm text-ink outline-none placeholder:text-muted lg:text-[15px]"
        />
      </div>
    </div>
  }

  <p class="text-xs text-muted lg:text-[13px]">
    Bằng việc đăng ký, bạn đồng ý với Điều khoản sử dụng và Chính sách quyền riêng tư của TripMate.
  </p>

  <button
    type="submit"
    [disabled]="submitting()"
    class="flex w-full items-center justify-center rounded-button bg-primary px-[18px] py-[15px] text-[15px] font-bold text-white hover:opacity-90 disabled:opacity-70"
  >
    Đăng ký
  </button>

  <p class="pt-8 text-center text-[11px] font-medium text-muted lg:pt-0 lg:text-[13px]">
    Đã có tài khoản?&nbsp;
    <a [routerLink]="links.login" class="hover:text-primary hover:underline">Đăng nhập</a>
  </p>
</form>
